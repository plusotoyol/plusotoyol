name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      # Backend build; frontend build sayfalar yazıldıktan sonra eklenecek (boş page.tsx dosyaları build'i bozar)
      - run: npm run build --workspace @plus-otoyol/backend
